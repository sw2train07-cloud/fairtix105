<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FairTix – 팬 인증 기반 동적 티켓팅</title>
<style>
:root{--blue:#007AFF;--bg:#F2F2F7;--card:#fff;--tx:#000;--sub:#8E8E93;--line:#E5E5EA;--green:#34C759;--red:#FF3B30;--orange:#FF9500}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#D1D1D6;display:flex;justify-content:center;align-items:center;min-height:100vh;color:var(--tx)}
#phone{width:393px;height:852px;background:var(--bg);border-radius:55px;border:10px solid #1c1c1e;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
@media(max-width:430px){body{background:var(--bg);display:block}#phone{width:100%;height:100vh;border:0;border-radius:0;box-shadow:none}}
#status{height:54px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 8px;font-weight:600;font-size:16px;background:rgba(242,242,247,.9);position:relative;z-index:5}
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:32px;background:#000;border-radius:20px}
#nav{flex:none;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;position:relative;background:rgba(242,242,247,.9)}
#back{position:absolute;left:12px;color:var(--blue);font-size:17px;border:0;background:none;display:none;cursor:pointer}
#screen{flex:1;overflow-y:auto;padding:8px 16px 24px;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
#tabs{flex:none;height:84px;background:rgba(249,249,249,.95);border-top:1px solid var(--line);display:flex;padding-top:6px}
#tabs button{flex:1;border:0;background:none;color:var(--sub);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;height:50px;cursor:pointer}
#tabs button.on{color:var(--blue)}
#tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:4px 0 12px}
h2{font-size:20px;font-weight:700;margin:22px 0 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.sub{color:var(--sub);font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:#E3E3E8;border-radius:10px;padding:9px 12px;color:var(--sub);font-size:16px;margin-bottom:14px}
.hero{border-radius:20px;height:190px;background:linear-gradient(135deg,#5E5CE6,#FF2D55);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:6px}
.hero b{font-size:24px;line-height:1.25}.hero span{font-size:13px;opacity:.9;margin-top:4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:#E8F2FF;color:var(--blue)}
.pill.g{background:#E3F8E8;color:#1F9D3F}.pill.o{background:#FFF1DC;color:#C77700}.pill.r{background:#FFE5E3;color:var(--red)}
.btn{width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;padding:15px;cursor:pointer;margin-top:8px}
.btn.off{background:#C7C7CC;pointer-events:none}.btn.gray{background:#E3E3E8;color:var(--blue)}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.show{flex:none;width:150px;cursor:pointer}
.poster{width:100%;aspect-ratio:3/4;border-radius:12px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .t{position:relative;font-weight:800;font-size:19px;line-height:1.1;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.poster .d{position:relative;font-size:11px;opacity:.9;margin-top:4px}
.show p{font-size:14px;font-weight:600;margin-top:8px}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:16px}
.row:last-child{border:0}.row .r{margin-left:auto;color:var(--sub);font-size:15px;text-align:right}
.fair{display:flex;gap:10px}.fair div{flex:1;background:var(--card);border-radius:14px;padding:12px}
.fair b{display:block;font-size:24px;margin-top:2px}
.step{display:flex;gap:12px;padding:14px;align-items:flex-start;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.dot{width:32px;height:32px;border-radius:50%;background:#E3E3E8;color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.step.done .dot{background:var(--green);color:#fff}.step.now .dot{background:var(--blue);color:#fff}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-top:8px;font-size:15px;cursor:pointer}
.opt.ok{border-color:var(--green);background:#F0FBF3}.opt.no{border-color:var(--red);background:#FFF0EF}
.count{display:flex;gap:8px;margin-top:6px}.count div{flex:1;background:#fff;border-radius:12px;padding:10px 0;text-align:center}
.count b{font-size:26px;font-variant-numeric:tabular-nums;display:block}.count span{font-size:11px;color:var(--sub)}
.seg{display:flex;background:#E3E3E8;border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}.seg .on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
svg.map .sec{cursor:pointer;transition:.15s;stroke:#fff;stroke-width:2}svg.map .sec:hover{opacity:.8}svg.map .sec.sel{stroke:#000;stroke-width:3}
.bar{height:8px;border-radius:4px;background:#E3E3E8;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--orange),var(--red))}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 18px 34px}
.view{height:150px;border-radius:12px;margin:10px 0;background:linear-gradient(#222 0 40%,#555 40% 55%,#8a6 55%);position:relative;overflow:hidden}
.view:after{content:"STAGE";position:absolute;top:22%;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;letter-spacing:3px;background:#FF2D55;padding:2px 14px;border-radius:3px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:18px}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid #C7C7CC;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer}.chk.on{background:var(--blue);border-color:var(--blue)}
.pay{display:flex;gap:8px}.pay button{flex:1;padding:12px 4px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer}.pay .on{border-color:var(--blue);background:#EAF3FF;color:var(--blue)}
.tkt{background:#fff;border-radius:20px;overflow:hidden;margin-bottom:14px}
.tkt .top{height:120px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.qrbox{padding:18px;text-align:center;position:relative}
canvas{width:200px;height:200px;image-rendering:pixelated;border-radius:8px}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:22px;font-weight:800;color:rgba(0,122,255,.1);transform:rotate(-20deg);white-space:nowrap}
.sticker{font-size:30px;cursor:pointer;padding:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.9);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30}
</style></head>
<body>
<div id="phone">
  <div id="island"></div>
  <div id="status"><span>9:41</span><span>5G ▮▮▮</span></div>
  <div id="nav"><button id="back">‹ 뒤로</button><span id="title">FairTix</span></div>
  <div id="screen"></div>
  <div id="tabs"></div>
</div>
<script>
/* ★ 실제 포스터 사진: img 항목에 이미지 파일 경로(예: "posters/nova.jpg")나 URL을 넣으면 사진으로 표시됩니다. 비워두면 그라데이션 포스터가 표시됩니다. */
const D=[{k:"VIP",base:165000,col:"#FF2D55"},{k:"스탠딩",base:143000,col:"#FF9500"},{k:"지정석 1층",base:121000,col:"#FFCC00"},{k:"지정석 2층",base:99000,col:"#34C759"}];

const SHOWS=[
{id:0,artist:"EXO",name:"EXO PLANET #6 – EXhOrizon [dot]",date:"11.6 금 – 11.8 일",times:"11/6 19:00 · 11/7 18:00 · 11/8 17:00",venue:"KSPO DOME",c:["#1F2A5C","#7B5CFF"],img:"",tag:"예매 중",tagc:"o",site:"멜론티켓",max:2,
 sec:[{k:"VIP 스탠딩",base:198000,col:"#FF2D55"},{k:"VIP 지정석",base:198000,col:"#FF9500"},{k:"일반 스탠딩",base:165000,col:"#FFCC00"},{k:"일반 지정석",base:165000,col:"#34C759"}],
 pay:["카드결제"],note:"회당 1인 2매(팬클럽 선예매 1매 포함) · 카드결제만 가능 · 실물 신분증 지참",
 s0:["팬클럽 멤버십 확인","EXO-L 가입자명 = 예매자명 = 관람자명이어야 해요"],quiz:["EXO 정규 8집의 제목은?",["REVERXE","EXPLORATION","DON'T FIGHT THE FEELING"],0]},
{id:1,artist:"CRAVITY",name:"2026 CRAVITY CONCERT <SONOROUS> in Seoul",date:"11.14 토",times:"11/14",venue:"올림픽공원",c:["#00A3A3","#2E5BFF"],img:"",tag:"예매 중",tagc:"o",site:"예매처 확인",quiz:["이번 콘서트 부제는?",["SONOROUS","AFTERGLOW","BLOOMING"],0]},
{id:2,artist:"Kings of Convenience",name:"Kings of Convenience – SJF at the Theater 2026",date:"11.18 수",times:"11/18",venue:"세종문화회관",c:["#6B8F71","#E8C468"],img:"",tag:"예매 중",tagc:"o",site:"예매처 확인",quiz:["이번 공연장은?",["세종문화회관","예술의전당","롯데콘서트홀"],0]},
{id:3,artist:"wave to earth",name:"wave to earth world tour 2026 – the pieces tour @Seoul",date:"12.18 금 – 12.20 일",times:"12/18 20:00 · 12/19 18:00 · 12/20 17:00",venue:"고려대 화정체육관",c:["#3A7BD5","#9BD6FF"],img:"",tag:"전석 매진",tagc:"r",site:"NOL · 멜론티켓",max:2,
 sec:[{k:"스탠딩석",base:132000,col:"#FF9500"},{k:"지정석",base:143000,col:"#34C759"}],
 cancel:"관람 10일 전까지 장당 4,000원 · 9~7일 전 10% · 6~3일 전 20% · 2일 전부터 30%",note:"9/1 오픈 직후 전 회차 매진, 12/18 추가 회차도 매진 · 만 11세 이상",
 quiz:["wave to earth 2집 앨범 제목은?",["bad pieces","play with Earth!","sunny"],0]}
];
const S={show:0,step:0,quiz:null,sec:null,qty:1,pay:0,agree:[0,0],captcha:0,paid:0,stk:[],hist:[]};
const $=s=>document.querySelector(s),scr=$("#screen");
const won=n=>n.toLocaleString("ko-KR")+"원";
const ICON={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.500-1-8-4-8-9V6z"/><path d="M8.500 12l2.500 2.500 4.500-5"/>',seat:'<path d="M6 3h12v9H6zM4 12h16v4H4zM7 16v5M17 16v5"/>',card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',tkt:'<path d="M3 8a2 2 0 0 0 0 8v3h18v-3a2 2 0 0 1 0-8V5H3z"/><path d="M14 5v14" stroke-dasharray="2 3"/>'};
const TABS=[["home","홈","home"],["verify","인증","shield"],["seat","좌석","seat"],["pay","결제","card"],["ticket","티켓","tkt"]];
const TITLES={home:"FairTix",verify:"팬 인증",seat:"좌석 선택",pay:"결제",ticket:"MY 티켓북"};
let page="home";
function poster(s,big){return `<div class="poster" style="background:linear-gradient(160deg,${s.c[0]},${s.c[1]})">${s.img?`<img src="${s.img}" alt="${s.name} 포스터" onerror="this.remove()">`:""}<div class="t">${s.artist}</div><div class="d">${big?s.name:s.date}</div></div>`}
const ART=(()=>{let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
const wrap=(bg,body)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="b" x1="0" y1="0" x2=".6" y2="1">${bg}</linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></linearGradient></defs><rect width="300" height="400" fill="url(#b)"/>${body}<rect width="300" height="400" fill="url(#s)"/></svg>`;
const stars=Array.from({length:46},()=>`<circle cx="${rnd()*300|0}" cy="${rnd()*280|0}" r="${(rnd()*1.4+.4).toFixed(1)}" fill="#fff" opacity="${(rnd()*.6+.3).toFixed(2)}"/>`).join("");
const bars=Array.from({length:21},(_,i)=>{const hh=30+Math.abs(Math.sin(i*.7))*110+(i%3)*14;return `<rect x="${12+i*13}" y="${150-hh/2}" width="7" rx="3.500" height="${hh}" fill="#fff" opacity="${(.35+(i%4)*.15).toFixed(2)}"/>`}).join("");
const waves=[250,280,310,340].map((y,i)=>`<path d="M0 ${y}Q75 ${y-34} 150 ${y}T300 ${y}V400H0Z" fill="#fff" opacity="${.14+i*.1}"/>`).join("");
const A=[
wrap('<stop offset="0" stop-color="#0B1030"/><stop offset="1" stop-color="#5B3FD6"/>',stars+`<g fill="none" stroke="#B9A8FF" stroke-opacity=".6"><ellipse cx="150" cy="150" rx="125" ry="40" transform="rotate(-18 150 150)"/><ellipse cx="150" cy="150" rx="95" ry="28" transform="rotate(-18 150 150)" stroke-opacity=".3"/></g><circle cx="150" cy="150" r="50" fill="#7B5CFF"/><circle cx="136" cy="136" r="46" fill="#A99BFF" opacity=".5"/><circle cx="262" cy="108" r="9" fill="#FFD6F5"/><circle cx="36" cy="196" r="6" fill="#9BE7FF"/><path d="M-20 300Q150 215 320 300V400H-20Z" fill="#070A22" opacity=".85"/>`),
wrap('<stop offset="0" stop-color="#00C2C2"/><stop offset="1" stop-color="#2339C9"/>',`<g fill="none" stroke="#fff" stroke-opacity=".25"><circle cx="150" cy="150" r="60"/><circle cx="150" cy="150" r="100"/><circle cx="150" cy="150" r="140"/></g>`+bars+`<circle cx="150" cy="150" r="8" fill="#fff"/>`),
wrap('<stop offset="0" stop-color="#F3E3B3"/><stop offset="1" stop-color="#5F8A6B"/>',`<circle cx="150" cy="120" r="58" fill="#E8A33D" opacity=".9"/><rect x="0" y="0" width="46" height="400" fill="#7A2E35" opacity=".85"/><rect x="254" y="0" width="46" height="400" fill="#7A2E35" opacity=".85"/><g stroke="#4A1A20" stroke-opacity=".5">${[10,22,34].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="400"/><line x1="${300-x}" y1="0" x2="${300-x}" y2="400"/>`).join("")}</g><rect x="46" y="250" width="208" height="150" fill="#3E5C48"/><g fill="#2A2A2A"><ellipse cx="110" cy="268" rx="20" ry="7"/><rect x="108" y="268" width="4" height="40"/><ellipse cx="190" cy="268" rx="20" ry="7"/><rect x="188" y="268" width="4" height="40"/></g>`),
wrap('<stop offset="0" stop-color="#BFE6FF"/><stop offset="1" stop-color="#2A5FC4"/>',`<circle cx="150" cy="115" r="52" fill="#3A7BD5"/><path d="M118 100q16-18 34-6t10 28-30 8-14-30z" fill="#6FCF97"/><path d="M160 138q14-6 24 4t-4 18-20-22z" fill="#6FCF97"/><circle cx="150" cy="115" r="52" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>`+waves)
];
return i=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(A[i])})();
SHOWS.forEach(s=>{if(!s.img)s.img=ART(s.id)});
function pick(i){Object.assign(S,{show:i,step:0,quiz:null,sec:null,captcha:0,agree:[0,0],pay:0,qty:1,price:0});go('verify')}
function go(p,push=true){if(push&&p!==page)S.hist.push(page);page=p;render()}

$("#back").onclick=back;

function chrome(){
 $("#title").textContent=TITLES[page];$("#back").style.display=S.hist.length&&page!=="home"?"block":"none";

}
function render(){chrome();scr.scrollTop=0;clearInterval(window.qt);scr.innerHTML=V[page]();if(page==="ticket")startQR();}
const sh=()=>SHOWS[S.show];
const V={
home(){return `<h1>FairTix</h1>
<div class="search">🔍 아티스트, 지역, 날짜 검색</div>
<div class="hero" onclick="go('verify')"><b>팬이 먼저,<br>공정한 예매.</b><span>매크로 없는 티켓팅 · 팬 인증으로 우선 예매</span></div>
<h2>공정 가격 지수</h2>
<div class="fair"><div><span class="sub">공정 가격 지수</span><b>100.0</b><span class="pill g">정가 기준</span></div><div><span class="sub">수집한 공연</span><b>${SHOWS.length}건</b><span class="pill">서울 · 11~12월</span></div></div>
<h2>실시간 인기 · 마감 임박</h2>
<div class="hs">${SHOWS.map(s=>`<div class="show" onclick="pick(${s.id})">${poster(s)}<p>${s.name}</p><span class="sub">${s.venue}</span><br><span class="pill ${s.tagc}">${s.tag}</span></div>`).join("")}</div>

<div class="list">${SHOWS.map(s=>`<div class="row" onclick="pick(${s.id})"><div style="width:54px">${poster(s)}</div><div style="flex:1"><b style="font-size:15px">${s.name}</b><div class="sub">${s.date}<br>${s.venue}</div></div><span class="pill ${s.tagc}">${s.tag}</span></div>`).join("")}</div>
<div class="sub" style="margin:-4px 4px 12px">※ 2026.10.22 기준 공개된 예매처 정보를 반영했어요. 일정·가격은 바뀔 수 있어요.</div>
<div class="card" style="background:#FFF1DC" onclick="toast('제보 페이지는 준비 중입니다')"><b>🚨 암표를 발견하셨나요?</b><div class="sub" style="margin-top:4px">제보하면 공정 예매 캠페인에 참여할 수 있어요.</div></div>`},
verify(){const s=sh(),st=S.step,Q=s.quiz,z=s.s0||["스트리밍 내역 연동","최근 6개월 재생 기록을 확인해요"];
 const step=(n,t,d)=>`<div class="step ${st>n?"done":st===n?"now":""}"><div class="dot">${st>n?"✓":n+1}</div><div style="flex:1"><b>${t}</b><div class="sub">${d}</div>${st===n?n===0?`<button class="btn" onclick="S.step=1;render()">${z[0]} 시작</button>`:n===1?Q[1].map((o,i)=>`<button class="opt ${S.quiz===i?(i===Q[2]?"ok":"no"):""}" onclick="S.quiz=${i};if(${i}===${Q[2]}){S.step=2}render()">${o}</button>`).join(""):"":""}</div></div>`;
 return `<div class="poster" style="aspect-ratio:16/10;background:linear-gradient(160deg,${s.c[0]},${s.c[1]})">${s.img?`<img src="${s.img}" onerror="this.remove()">`:""}<div class="t" style="font-size:28px">${s.artist}</div><div class="d">${s.name}</div></div>
<h2>예매 정보</h2><div class="list"><div class="row">일정<span class="r">${s.times}</span></div><div class="row">장소<span class="r">${s.venue}</span></div><div class="row">예매처<span class="r">${s.site}</span></div><div class="row">상태<span class="r"><span class="pill ${s.tagc}">${s.tag}</span></span></div></div>
${s.note?`<div class="card sub">${s.note}</div>`:""}
<h2>팬 진정성 인증</h2><div class="list">${step(0,z[0],z[1])}${step(1,"아티스트 팬 퀴즈","1문제: "+Q[0])}${step(2,"인증 완료","우선 예매 권한이 부여됩니다")}</div>
${st>=2?`<div class="card" style="background:#E3F8E8"><b>✅ 팬 인증 완료</b><div class="sub">좌석 선택에서 팬 할인(10%)이 시뮬레이션돼요.</div></div><button class="btn" onclick="go('seat')">좌석 선택하기</button>`:`<button class="btn off">인증 후 예매할 수 있어요</button>`}`},
seat(){const s=sh(),fan=S.step>=2,SC=s.sec||D,cur=S.sec!==null?SC[S.sec]:null;
 const P=[["M85 40h160v50H85z",70],["M60 100h210v50H60z",130],["M40 160h250v36H40z",183],["M20 204h290v22H20z",219]];
 const pr=(x,i)=>Math.round(x.base*[1.04,1.02,1,.98][i]*(fan?.9:1)/100)*100;
 return `<div class="sub" style="margin-bottom:8px">${s.name}<br>${fan?"팬 인증 완료 · 팬 할인 시뮬레이션 적용":"팬 인증 전 · 일반 가격"}${s.sec?"":" · 예시 가격"}</div>
<div class="card"><svg class="map" viewBox="0 0 330 260" width="100%">
<rect x="95" y="6" width="140" height="24" rx="6" fill="#1C1C1E"/><text x="165" y="23" fill="#fff" font-size="12" text-anchor="middle">STAGE</text>
${SC.map((x,i)=>{const q=P[Math.min(i,3)];const d=SC.length===2?P[[1,3][i]]:q;return `<path class="sec ${S.sec===i?"sel":""}" d="${d[0]}" fill="${x.col}" onclick="S.sec=${i};render()"/><text x="165" y="${d[1]}" font-size="12" font-weight="600" text-anchor="middle" fill="#fff" pointer-events="none">${x.k}</text>`}).join("")}</svg></div>
<div class="list">${SC.map((x,i)=>`<div class="row" onclick="S.sec=${i};render()" style="${S.sec===i?"background:#EAF3FF":""}"><span style="width:12px;height:12px;border-radius:50%;background:${x.col}"></span><span>${x.k}</span><span class="pill ${fan?"g":i<2?"o":""}" style="margin-left:4px">${fan?"Fan Discount":i<2?"Dynamic":"Normal"}</span><span class="r"><b style="color:#000">${won(pr(x,i))}</b><br><span style="font-size:11px">정가 ${won(x.base)}</span></span></div>`).join("")}</div>
<div class="card"><b>수요 지수</b> <span class="sub">${s.tag}</span><div class="bar"><i style="width:${s.tag==="전석 매진"?100:72}%"></i></div><div class="sub" style="margin-top:6px">정가는 예매처 공개 가격이에요. 동적 가격·팬 할인은 FairTix의 시뮬레이션입니다.</div></div>
${cur?`<button class="btn gray" onclick="viewPop()">🔭 시야 미리보기</button><button class="btn" onclick="S.price=${pr(cur,S.sec)};go('pay')">${cur.k} ${won(pr(cur,S.sec))} 선택</button>`:`<button class="btn off">구역을 선택해 주세요</button>`}`},
pay(){const s=sh(),c=(s.sec||D)[S.sec===null?0:S.sec],p=S.price||c.base,fee=2000,PM=s.pay||["간편결제","계좌이체","카드"],mx=s.max||2,ok=S.captcha&&S.agree[0]&&S.agree[1],cn=s.cancel||"예매처 취소수수료 규정에 따릅니다";
 return `<div class="card"><b>${s.name}</b><div class="sub">${s.date} · ${c.k} · 회당 1인 최대 ${mx}매</div></div>
<div class="card"><b>🤖 사람 확인</b><div class="sub">팬님의 소중한 자리를 안전하게 확보 중입니다!</div><div class="row" style="padding:12px 0"><div class="chk ${S.captcha?"on":""}" onclick="S.captcha=1;render()">${S.captcha?"✓":""}</div>로봇이 아닙니다 <span class="r">AI 이상 탐지 ${S.captcha?"통과":"대기"}</span></div></div>
<div class="card"><b>수량</b><div style="display:flex;align-items:center;gap:20px;margin-top:8px"><button class="btn gray" style="width:48px;margin:0;padding:8px" onclick="S.qty=Math.max(1,S.qty-1);render()">−</button><b style="font-size:20px">${S.qty}</b><button class="btn gray" style="width:48px;margin:0;padding:8px" onclick="S.qty=Math.min(${mx},S.qty+1);render()">＋</button><span class="sub">최대 ${mx}매</span></div></div>
<h2 style="margin-top:6px">결제 수단</h2><div class="pay">${PM.map((t,i)=>`<button class="${S.pay===i?"on":""}" onclick="S.pay=${i};render()">${t}</button>`).join("")}</div>
<div class="card" style="margin-top:12px">${["취소 수수료 안내에 동의합니다: "+cn,"개인정보 수집에 동의합니다"].map((t,i)=>`<div class="row" style="padding:8px 0;font-size:14px"><div class="chk ${S.agree[i]?"on":""}" onclick="S.agree[${i}]^=1;render()">${S.agree[i]?"✓":""}</div>${t}</div>`).join("")}</div>
<div class="card sum"><div><span>티켓 금액 <span class="sub">(정가 ${won(c.base)})</span></span><span>${won(p*S.qty)}</span></div><div><span>예매 수수료(예시)</span><span>${won(fee*S.qty)}</span></div><div class="tot"><span>최종 결제 금액</span><span>${won((p+fee)*S.qty)}</span></div></div>
<button class="btn ${ok?"":"off"}" onclick="S.paid=1;toast('결제가 완료됐어요 (시연)');go('ticket')">${won((p+fee)*S.qty)} 결제하기</button>`},
ticket(){const s=sh();return `<h1 style="font-size:28px">MY 티켓북</h1>
${S.paid?`<div class="tkt"><div class="top" style="background:linear-gradient(135deg,${s.c[0]},${s.c[1]})"><b style="font-size:24px">${s.artist}</b><span style="font-size:13px">${s.name}<br>${s.date} · ${s.venue}</span></div>
<div class="qrbox"><div class="wm">FAIRTIX · 캡처 불가</div><canvas id="qr" width="21" height="21"></canvas><div style="margin-top:8px"><b id="qt">5</b>초 후 QR 갱신</div><div class="sub">시간마다 바뀌는 동적 QR · 캡처본은 입장할 수 없어요</div></div></div>
<div class="card"><b>입장 대기열</b><div class="bar"><i style="width:35%;background:var(--blue)"></i></div><div class="sub" style="margin-top:6px">내 앞 대기 128명 · 약 6분</div></div>`:`<div class="card" style="text-align:center;padding:30px"><div style="font-size:40px">🎟️</div><b>아직 예매한 티켓이 없어요</b><div class="sub">공연을 골라 팬 인증부터 시작해 보세요.</div><button class="btn" onclick="go('home')">공연 보러 가기</button></div>`}
<h2>티켓 꾸미기</h2><div class="card"><div class="sub">스티커를 눌러 추가하세요</div><div style="display:flex;gap:6px;margin:6px 0">${["💜","⭐","🎤","🔥","🌙"].map(e=>`<span class="sticker" onclick="S.stk.push('${e}');render()">${e}</span>`).join("")}</div><div style="min-height:44px;font-size:28px;background:var(--bg);border-radius:10px;padding:6px">${S.stk.join(" ")||'<span class="sub" style="font-size:13px">아직 스티커가 없어요</span>'}</div></div>
<h2>디지털 티켓북 갤러리</h2><div class="grid3">${SHOWS.map(x=>poster(x)).join("")}</div>
<button class="btn gray" onclick="toast('SNS 공유 이미지가 저장됐어요')">SNS에 공유하기</button>`}
};
function viewPop(){const c=(sh().sec||D)[S.sec],m=document.createElement("div");m.className="modal";m.onclick=e=>{if(e.target===m)m.remove()};
 m.innerHTML=`<div class="sheet"><b style="font-size:20px">${c.k} 시야 미리보기</b><div class="view"></div><div class="sub">무대와 가까울수록 크게 보여요. 실제 시야는 좌석 위치에 따라 달라질 수 있어요.</div><button class="btn" onclick="this.closest('.modal').remove()">닫기</button></div>`;$("#phone").appendChild(m)}
function startQR(){if(!S.paid)return;const draw=()=>{const c=$("#qr");if(!c)return;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,21,21);x.fillStyle="#000";const seed=Math.floor(Date.now()/5000);let r=seed*9301+49297;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
 for(let i=0;i<21;i++)for(let j=0;j<21;j++){const f=(i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);if(f){const a=i%14,b=j%14;const e=Math.min(a<7?a:a,6),on=(a===0||a===6||b===0||b===6)||(a>=2&&a<=4&&b>=2&&b<=4);if(i<7&&j<7||i<7&&j>13||i>13&&j<7){const ii=i>13?i-14:i,jj=j>13?j-14:j;if(ii===0||ii===6||jj===0||jj===6||(ii>=2&&ii<=4&&jj>=2&&jj<=4))x.fillRect(j,i,1,1)}}else if(rnd()>.5)x.fillRect(j,i,1,1)}};
 draw();window.qt=setInterval(()=>{draw();const t=$("#qt");if(t)t.textContent=5-Math.floor((Date.now()/1000)%5)},1000)}
render();
</script></body></html>
